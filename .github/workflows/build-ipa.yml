# Build the LivePhotoApp as an UNSIGNED .ipa for AltStore sideloading.
# Runs on GitHub's macOS runner (free for public repos). No Apple Developer
# account / signing is required to compile; AltStore signs the IPA on the
# user's own iPhone with their free Apple ID. Free Apple IDs must refresh
# the app every 7 days (AltStore does this automatically when the iPhone is
# on the same Wi-Fi as AltServer).

name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA (AltStore)
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build unsigned archive
        run: |
          xcodebuild -project LivePhotoApp.xcodeproj \
            -scheme LivePhotoApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/LivePhotoApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/LivePhotoApp.xcarchive/Products/Applications/LivePhotoApp.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r LivePhotoApp-unsigned.ipa Payload
          rm -rf Payload
          ls -lh LivePhotoApp-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LivePhotoApp-unsigned
          path: LivePhotoApp-unsigned.ipa
          if-no-files-found: error
